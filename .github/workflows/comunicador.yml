# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion


on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿Que villano quieres que transmita el mensaje?'
        required: true
        type: choice
        options:
          - Lex Luthor
          - Thanos
          - Magneto
          - Brainiac
          - Joker
      mensaje:
        description: 'Mensaje para el consejo de villanos'
        required: true
        default: 'La mision fue un exito, el mundo es nuestro'


      prioridad:
        description: 'Nivel de prioridad del mensaje'
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Urgente  
jobs:

  transmitir-mensaje:  
    runs-on: ubuntu-latest


    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "========================================================"
          echo "  Transmision interceptada por la legion de villanos"
          echo "========================================================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo "" 
          echo "Fecha: $(date -u +"%d/%m/%Y %H:%M:%S UTC")"
          echo "---------- mensaje ----------"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "---------- ${{ inputs.villano }}"
          echo "..."
